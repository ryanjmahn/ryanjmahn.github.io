<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>diary · 재민</title>
<meta name="description" content="재민's diary — short entries, roughly chronological." />
<link rel="stylesheet" href="style.css" />
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
</head>
<body data-page="diary">

<div class="sf-bg" aria-hidden="true">
  <picture>
    <source srcset="assets/images/sf-golden-gate.webp" type="image/webp" />
    <img src="assets/images/sf-golden-gate.jpg" alt="" loading="eager" decoding="async" />
  </picture>
</div>

<button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">dark</button>

<main class="bio">

  <header class="intro">
    <p class="back-link"><a href="index.html">← 재민</a></p>
    <h1 class="name">diary</h1>
    <p class="tagline">short entries, roughly chronological. nothing curated.</p>
  </header>

  <ol class="entries diary-entries">

    <li class="entry diary-entry">
      <span class="entry-year">2026-09-14</span>
      <div class="entry-body">
        <p>
          started this page today. no promises about how often it gets updated —
          mostly just want somewhere to put the smaller stuff that doesn't belong
          on the front page.
        </p>
      </div>
    </li>

  </ol>

</main>

<script src="script.js" defer></script>
</body>
</html>
