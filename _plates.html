<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>_plates — scratch</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  .scratch-wrap { max-width: 1200px; margin: 0 auto; padding: var(--s3) var(--gutter); }
  .scratch-wrap h1 { font-family: var(--font-label); font-size: 15px; }
  .scratch-pair { margin-bottom: var(--s4); }
</style>

<body class="surface-paper-body">
<div class="grain-global" aria-hidden="true"></div>
<div class="scratch-wrap">
<h1>_plates.html — checked against §4, delete before shipping (§7 step 7)</h1>

<div class="scratch-pair">
  <div class="plate-pair">

    <!-- Plate 001 — home hero — dark, tonal fade -->
    <figure class="plate plate--dark reveal">
      <div class="local-grain" aria-hidden="true"></div>
      <div class="plate__photo-placeholder">
        <span>lone climber ridge black and white / summit clouds hiker</span>
      </div>
      <div class="plate__wordmark"><span class="rule"></span> ryan jaemin ahn&trade; <span class="rule"></span></div>
      <div class="plate__index">001<span class="tri">▼</span></div>
      <h2 class="plate__headline is-huge tech-fade">build responsibly.</h2>
    </figure>

    <!-- Plate 002 — Probix — paper, straddle + definition -->
    <figure class="plate plate--paper reveal" data-reveal-delay="120">
      <div class="plate__dust" aria-hidden="true">
        <svg viewBox="0 0 400 500" preserveAspectRatio="none">
          <line x1="30" y1="60" x2="120" y2="420" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>
          <line x1="340" y1="20" x2="300" y2="200" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
          <circle cx="60" cy="150" r="1.2" fill="#111" fill-opacity=".2"/>
          <circle cx="250" cy="300" r="1" fill="#111" fill-opacity=".2"/>
          <circle cx="180" cy="420" r="1.4" fill="#111" fill-opacity=".18"/>
        </svg>
      </div>
      <div class="plate__kicker">probix labs</div>
      <div class="plate__index">002<span class="tri">▼</span></div>
      <div class="plate__meta"><b>(co-founder, coo)</b> ▾ — probix</div>
      <div class="plate__inset">
        <div class="plate__photo-placeholder">
          <span>laboratory 1920s public domain / scientist microscope vintage</span>
        </div>
        <div class="grade-warm" style="position:absolute; inset:0;"></div>
      </div>
      <h2 class="plate__headline tech-straddle">Reproducible<span class="accent-dot">.</span></h2>
      <div class="plate__definition">
        <span class="bracket">[adjective]</span>
        <span class="def">able to be obtained again — by someone else, following the same method.</span>
      </div>
    </figure>

  </div>
  <div class="caption-row">
    <span class="caption-row__label">ryan jaemin ahn</span>
    <span class="caption-row__phrase">Builder, seventeen, Seoul.</span>
    <span class="caption-row__num">01</span>
  </div>
</div>

<div class="scratch-pair">
  <div class="plate-pair">

    <!-- Plate 003 — STEMise — dark, tonal fade -->
    <figure class="plate plate--dark reveal">
      <div class="local-grain" aria-hidden="true"></div>
      <div class="plate__photo-placeholder">
        <span>horizon ocean black and white / crowd aerial black and white</span>
      </div>
      <div class="grade-film-overlay"></div>
      <div class="plate__index">003<span class="tri">▼</span></div>
      <div class="plate__body-line">4,500+ youths reached.</div>
      <h2 class="plate__headline tech-fade has-body-line">132 nations.</h2>
    </figure>

    <!-- Plate 004 — Hackathons — paper, straddle -->
    <figure class="plate plate--paper reveal" data-reveal-delay="120">
      <div class="plate__dust" aria-hidden="true">
        <svg viewBox="0 0 400 500" preserveAspectRatio="none">
          <line x1="350" y1="40" x2="280" y2="340" stroke="#fff" stroke-opacity=".28" stroke-width="1"/>
          <circle cx="90" cy="90" r="1.3" fill="#111" fill-opacity=".2"/>
          <circle cx="310" cy="440" r="1" fill="#111" fill-opacity=".18"/>
        </svg>
      </div>
      <div class="plate__index">004<span class="tri">▼</span></div>
      <div class="plate__meta"><b>(3 directed)</b> ▾ — hackathons</div>
      <div class="plate__inset">
        <div class="plate__photo-placeholder">
          <span>auditorium black and white / people working laptops hall</span>
        </div>
        <div class="grade-film-overlay"></div>
      </div>
      <h2 class="plate__headline tech-straddle">2,000+ builders<span class="accent-dot">.</span></h2>
      <div class="plate__definition">
        <span class="bracket">[noun, pl.]</span>
        <span class="def">people who make things that didn't exist yesterday.</span>
      </div>
    </figure>

  </div>
  <div class="caption-row">
    <span class="caption-row__label">STEMise · Hackathons</span>
    <span class="caption-row__phrase">STEM, everywhere it's missing.</span>
    <span class="caption-row__num">03 / 04</span>
  </div>
</div>

<div class="scratch-pair" style="max-width: 680px; margin: 0 auto var(--s4);">
  <!-- Plate 005 — Research — dark, tonal fade -->
  <figure class="plate plate--dark plate--full reveal">
    <div class="local-grain" aria-hidden="true"></div>
    <div class="plate__photo-placeholder">
      <span>pancreatic tissue micrograph public domain / cells microscopy public domain (NIH / NCI Visuals Online)</span>
    </div>
    <div class="grade-cyan-overlay"></div>
    <div class="plate__index">005<span class="tri">▼</span></div>
    <h2 class="plate__headline tech-fade">PDAC.</h2>
    <div class="plate__definition">
      <span class="bracket">[abbrev.]</span>
      <span class="def">pancreatic ductal adenocarcinoma — the most common pancreatic cancer, and one of the hardest to catch early.</span>
    </div>
  </figure>
  <div class="caption-row">
    <span class="caption-row__label">Research</span>
    <span class="caption-row__phrase">Pancreatic cancer, computationally.</span>
    <span class="caption-row__num">05</span>
  </div>
</div>

</div>
